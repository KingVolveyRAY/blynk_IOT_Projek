<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadow Filter -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="40" y="25" width="1120" height="75" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#card-shadow)"/>
  <text x="600" y="60" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">SKEMA WIRING / RANGKAIAN IOT ESP32</text>
  <text x="600" y="85" fill="#38bdf8" font-size="14" text-anchor="middle">Monitoring Suhu &amp; Kelembapan Udara (DHT11) + Kelembapan Tanah (FC-28) via Blynk IoT</text>

  <!-- ==================== 1. ESP32 BOARD (Left) ==================== -->
  <g id="esp32-board" filter="url(#card-shadow)">
    <!-- PCB Board -->
    <rect x="70" y="140" width="280" height="520" rx="16" fill="#111827" stroke="#475569" stroke-width="3"/>
    
    <!-- Onboard Antenna -->
    <rect x="120" y="150" width="180" height="45" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="210" y="178" fill="#fecaca" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">ESP32 ANTENNA</text>
    
    <!-- Metal Shield ESP-WROOM-32 -->
    <rect x="110" y="220" width="200" height="220" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <text x="210" y="320" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">ESP-WROOM-32</text>
    <text x="210" y="345" fill="#94a3b8" font-size="12" text-anchor="middle">Wi-Fi &amp; Bluetooth Dual-Core</text>
    <circle cx="130" cy="240" r="4" fill="#64748b"/>

    <!-- Micro USB Port -->
    <rect x="175" y="640" width="70" height="30" rx="4" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="210" y="658" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">MICRO-USB</text>

    <!-- Board Name -->
    <text x="210" y="580" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">DOIT ESP32 DEVKIT V1</text>

    <!-- RIGHT HEADER PINS (Facing Sensors) -->
    <!-- Pin 3V3 -->
    <circle cx="340" cy="260" r="7" fill="#ef4444" filter="url(#glow-red)"/>
    <text x="325" y="265" fill="#fca5a5" font-size="13" font-weight="bold" text-anchor="end">3V3</text>

    <!-- Pin GND -->
    <circle cx="340" cy="330" r="7" fill="#64748b"/>
    <text x="325" y="335" fill="#cbd5e1" font-size="13" font-weight="bold" text-anchor="end">GND</text>

    <!-- Pin GPIO 4 (D4) -->
    <circle cx="340" cy="420" r="7" fill="#f59e0b" filter="url(#glow-yellow)"/>
    <text x="325" y="425" fill="#fde68a" font-size="13" font-weight="bold" text-anchor="end">GPIO 4 (D4)</text>

    <!-- Pin GPIO 34 (ADC1) -->
    <circle cx="340" cy="520" r="7" fill="#10b981" filter="url(#glow-green)"/>
    <text x="325" y="525" fill="#a7f3d0" font-size="13" font-weight="bold" text-anchor="end">GPIO 34 (ADC1)</text>
  </g>

  <!-- ==================== 2. SENSOR DHT11 (Top Right) ==================== -->
  <g id="dht11-sensor" filter="url(#card-shadow)">
    <!-- Container Card -->
    <rect x="740" y="140" width="380" height="230" rx="14" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <text x="890" y="175" fill="#ffffff" font-size="16" font-weight="bold">SENSOR DHT11</text>
    <text x="890" y="195" fill="#94a3b8" font-size="12">Suhu &amp; Kelembapan Udara</text>

    <!-- DHT11 Blue Body -->
    <rect x="765" y="170" width="100" height="130" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <!-- Ventilation Grids -->
    <line x1="780" y1="195" x2="850" y2="195" stroke="#0369a1" stroke-width="3"/>
    <line x1="780" y1="215" x2="850" y2="215" stroke="#0369a1" stroke-width="3"/>
    <line x1="780" y1="235" x2="850" y2="235" stroke="#0369a1" stroke-width="3"/>
    <line x1="780" y1="255" x2="850" y2="255" stroke="#0369a1" stroke-width="3"/>
    <text x="815" y="285" fill="#e0f2fe" font-size="11" font-weight="bold" text-anchor="middle">DHT11</text>

    <!-- DHT11 Pins (Facing Left) -->
    <!-- VCC (+) -->
    <circle cx="740" cy="220" r="7" fill="#ef4444" filter="url(#glow-red)"/>
    <text x="755" y="225" fill="#fca5a5" font-size="12" font-weight="bold">VCC (+)</text>

    <!-- DATA / OUT -->
    <circle cx="740" cy="260" r="7" fill="#f59e0b" filter="url(#glow-yellow)"/>
    <text x="755" y="265" fill="#fde68a" font-size="12" font-weight="bold">DATA / OUT</text>

    <!-- GND (-) -->
    <circle cx="740" cy="300" r="7" fill="#64748b"/>
    <text x="755" y="305" fill="#cbd5e1" font-size="12" font-weight="bold">GND (-)</text>
  </g>

  <!-- ==================== 3. SENSOR FC-28 (Bottom Right) ==================== -->
  <g id="fc28-sensor" filter="url(#card-shadow)">
    <!-- Container Card -->
    <rect x="660" y="420" width="460" height="240" rx="14" fill="#1e293b" stroke="#059669" stroke-width="2"/>
    <text x="890" y="450" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">SENSOR KELEMBAPAN TANAH (FC-28)</text>

    <!-- Driver Module LM393 -->
    <rect x="685" y="475" width="160" height="150" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <text x="765" y="505" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Modul LM393</text>
    <!-- Trimmer Potentiometer -->
    <circle cx="765" cy="545" r="16" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5"/>
    <line x1="755" y1="545" x2="775" y2="545" stroke="#ffffff" stroke-width="2.5"/>
    <text x="765" y="580" fill="#ccfbf1" font-size="10" text-anchor="middle">Sensitivitas</text>

    <!-- FC-28 Driver Pins (Facing Left) -->
    <!-- VCC -->
    <circle cx="660" cy="495" r="6" fill="#ef4444" filter="url(#glow-red)"/>
    <text x="675" y="500" fill="#fca5a5" font-size="11" font-weight="bold">VCC</text>

    <!-- GND -->
    <circle cx="660" cy="530" r="6" fill="#64748b"/>
    <text x="675" y="535" fill="#cbd5e1" font-size="11" font-weight="bold">GND</text>

    <!-- D0 (Not Connected) -->
    <circle cx="660" cy="565" r="5" fill="#475569"/>
    <line x1="655" y1="560" x2="665" y2="570" stroke="#f87171" stroke-width="1.5"/>
    <line x1="665" y1="560" x2="655" y2="570" stroke="#f87171" stroke-width="1.5"/>
    <text x="675" y="570" fill="#94a3b8" font-size="11">D0 (N/C)</text>

    <!-- A0 (Analog Out) -->
    <circle cx="660" cy="600" r="6" fill="#10b981" filter="url(#glow-green)"/>
    <text x="675" y="605" fill="#a7f3d0" font-size="11" font-weight="bold">A0 (Analog)</text>

    <!-- Probe Garpu Besi -->
    <rect x="910" y="475" width="170" height="150" rx="8" fill="#111827" stroke="#eab308" stroke-width="1.5"/>
    <text x="995" y="505" fill="#fef08a" font-size="12" font-weight="bold" text-anchor="middle">Probe Garpu Logam</text>
    <!-- Prongs -->
    <rect x="945" y="525" width="22" height="85" rx="3" fill="#ca8a04" stroke="#fde047" stroke-width="1.5"/>
    <rect x="1025" y="525" width="22" height="85" rx="3" fill="#ca8a04" stroke="#fde047" stroke-width="1.5"/>
    <!-- Connecting 2-pin jumper -->
    <path d="M 845 520 L 910 520" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4,4"/>
    <path d="M 845 580 L 910 580" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4,4"/>
  </g>

  <!-- ==================== 4. COLOR-CODED WIRES ==================== -->
  <!-- RED WIRE (3.3V Power Bus) -->
  <path d="M 340 260 L 460 260 L 460 220 L 740 220" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <path d="M 460 260 L 460 495 L 660 495" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <circle cx="460" cy="260" r="5" fill="#ef4444"/>
  <rect x="420" y="235" width="80" height="20" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
  <text x="460" y="249" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">3.3V BUS</text>

  <!-- BLACK / GREY WIRE (GND Bus) -->
  <path d="M 340 330 L 510 330 L 510 300 L 740 300" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 510 330 L 510 530 L 660 530" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="510" cy="330" r="5" fill="#94a3b8"/>
  <rect x="475" y="340" width="70" height="20" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <text x="510" y="354" fill="#f1f5f9" font-size="10" font-weight="bold" text-anchor="middle">GND BUS</text>

  <!-- YELLOW WIRE (DHT11 DATA -> GPIO 4) -->
  <path d="M 340 420 L 560 420 L 560 260 L 740 260" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <rect x="410" y="405" width="130" height="20" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
  <text x="475" y="419" fill="#fef3c7" font-size="10" font-weight="bold" text-anchor="middle">DATA DHT11 (GPIO 4)</text>

  <!-- GREEN WIRE (FC-28 A0 -> GPIO 34) -->
  <path d="M 340 520 L 420 520 L 420 600 L 660 600" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <rect x="430" y="585" width="140" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="500" y="599" fill="#d1fae5" font-size="10" font-weight="bold" text-anchor="middle">ANALOG FC-28 (GPIO 34)</text>

  <!-- ==================== 5. FOOTER / LEGEND ==================== -->
  <rect x="40" y="700" width="1120" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  
  <line x1="70" y1="725" x2="110" y2="725" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <text x="120" y="730" fill="#f8fafc" font-size="12">Kabel Merah: 3.3V (VCC)</text>

  <line x1="320" y1="725" x2="360" y2="725" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <text x="370" y="730" fill="#f8fafc" font-size="12">Kabel Abu/Hitam: Ground (GND)</text>

  <line x1="620" y1="725" x2="660" y2="725" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <text x="670" y="730" fill="#f8fafc" font-size="12">Kabel Kuning: Data DHT11 (GPIO 4)</text>

  <line x1="880" y1="725" x2="920" y2="725" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  <text x="930" y="730" fill="#f8fafc" font-size="12">Kabel Hijau: Analog FC-28 (GPIO 34)</text>

  <text x="600" y="753" fill="#38bdf8" font-size="11.5" font-weight="bold" text-anchor="middle">Catatan: Sensor wajib menggunakan tegangan 3.3V dan pin ADC1 (GPIO 34) agar pembacaan analog tidak terganggu WiFi.</text>
</svg>

